name: Android CI Build APK

# 发版流程（约定）：
#   1. 修改 app/build.gradle.kts 的 versionCode / versionName
#   2. 功能有变动时同步更新 README.md
#   3. git tag -a v<versionName> -F <release-notes.md>  （tag 附注即 Release 说明）
#   4. git push origin main && git push origin v<versionName>
# 推送 v* tag 后，本 workflow 会自动构建 APK 并创建 GitHub Release、挂载 APK 产物。

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Verify tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VN=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          echo "tag=${GITHUB_REF_NAME} versionName=${VN}"
          if [ "v${VN}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 versionName ${VN} 不一致，请先同步 build.gradle.kts"
            exit 1
          fi

      - name: Build Debug & Release APK
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: SMSForwarder-APK
          path: app/build/outputs/apk/**/*.apk

      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/SMSForwarder-${GITHUB_REF_NAME}-debug.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "release-assets/SMSForwarder-${GITHUB_REF_NAME}-release-unsigned.apk"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > release-assets/release-notes.md
          echo "--- release notes ---"
          cat release-assets/release-notes.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-assets/release-notes.md
          files: |
            release-assets/SMSForwarder-*-debug.apk
            release-assets/SMSForwarder-*-release-unsigned.apk
          draft: false
          prerelease: false
